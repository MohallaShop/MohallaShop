[project]
name = "mohallashop-backend"
version = "0.1.0"
description = "MohallaShop — FastAPI backend (modular monolith)"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "MohallaShop" }]

dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.30",
    "alembic~=1.14",
    "pydantic~=2.9",
    "pydantic-settings~=2.6",
    "pyjwt~=2.9",
    "httpx~=0.27",
    "structlog~=24.4",
    "slowapi~=0.1.9",
    "python-multipart~=0.0.12",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "pytest-cov~=6.0",
    "ruff~=0.7",
    "mypy~=1.13",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── uv ──────────────────────────────────────────────────────────
[tool.uv]
package = true
dev-dependencies = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "pytest-cov~=6.0",
    "ruff~=0.7",
    "mypy~=1.13",
    "pgserver>=0.1.4",
]

# ── ruff ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "ASYNC",    # async linting
    "S",        # bandit (security)
    "RUF",      # ruff-specific
]
ignore = [
    "S101",     # use of assert (fine in tests)
    "S104",     # 0.0.0.0 binding (intended)
    "B008",     # function call in default arg (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "S101"]
"app/core/security.py" = ["S106"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

# ── mypy ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "slowapi.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ── pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
]
